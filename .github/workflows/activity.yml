name: Update contribution graph

on:
  schedule:
    # 每天北京时间 09:23 更新，避开整点队列。
    - cron: "23 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_activity.py"
      - ".github/workflows/activity.yml"

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Generate SVGs from GitHub contributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/generate_activity.py
      - name: Commit updated graphs
        run: |
          git add assets/activity-light.svg assets/activity-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update contribution activity"
          git push
